{% extends "main_template.html" %}

{% block content %}
    <h1 class="center-heading">
        مقالات
    </h1>

    <div class="card-container">
        {% for article in articles%}
            <div class="col-md-5 mb-3">
                <div class="card" style="text-align: center; font-size: 20px">
                    <div class="card-header">
                        {{article.article_title}}
                    </div>
                    <div class="card-body" style="text-align: center;">
                        <blockquote class="blockquote mb-0">
                        <img src=/media/{{article.article_main_picture}} alt={{article.article_title}} width="400" height="300" >
                        <p style="text-align: justify;">{{article.article_abstract}}</p>
                        <a class="heart-liked" onclick="#">
                            <i class="fas fa-heart"> {{ article.like_count }}</i>
                        </a>
                        <br><br>
                        <a href="/blog/detail/{{ article.id }}/" class="btn btn-primary">مطالعه کامل</a>
                        </blockquote>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>

{% endblock %}
